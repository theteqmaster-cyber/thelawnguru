<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#0f5132" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16a34a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark: Stylized 'L' with organic turf blade curve and crown droplet -->
  <g transform="translate(10, 5)" filter="url(#subtleGlow)">
    <!-- Base curved circle / badge background -->
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#0d2818" />
    <rect x="1" y="1" width="54" height="54" rx="15" stroke="url(#primaryGrad)" stroke-width="1.5" fill="none" />
    
    <!-- Stylized 'L' stem (thick modern stroke) -->
    <path d="M 18 14 L 18 36 C 18 40 21 43 25 43 L 42 43 C 44 43 45 40 43.5 38.5 C 38 33 32 30 26 29 L 26 14 C 26 12 24 10 22 10 C 20 10 18 12 18 14 Z" fill="url(#primaryGrad)" />
    
    <!-- Dynamic grass leaf swoosh overlapping into 'L' foot -->
    <path d="M 19 41 C 25 35 34 32 44 32 C 45.5 32 46 33.8 44.5 35 C 38 40.5 30 43.5 22 43 C 20 43 18.5 42.2 19 41 Z" fill="url(#leafGrad)" />
    
    <!-- Sun / Vitality spark droplet -->
    <circle cx="39" cy="18" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(80, 10)">
    <!-- THE LAWN -->
    <text x="0" y="28" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#0f172a">
      THE LAWN <tspan fill="url(#primaryGrad)">GURU</tspan>
    </text>
    <!-- Tagline -->
    <text x="1" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.2" fill="#64748b">
      ZIMBABWE • TURF &amp; LANDSCAPING
    </text>
  </g>
</svg>
